name: luliverify_flutter
description: Flutter SDK for LuliVerify workflows with native verification screens, hosted browser flows, guided capture, and session callbacks.
version: 0.1.0-dev.1
repository: https://github.com/Luliverify/LuliVerify-Flutter-Sdk
issue_tracker: https://github.com/Luliverify/LuliVerify-Flutter-Sdk/issues
topics:
  - identity-verification
  - kyc
  - onboarding
platforms:
  android:
  ios:
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  camera: ^0.12.2
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  lucide_icons_flutter: ^4.0.1
  app_links: ^7.2.2
  url_launcher: ^6.3.3
dev_dependencies:
  camera_platform_interface: ^2.15.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2
flutter:
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
